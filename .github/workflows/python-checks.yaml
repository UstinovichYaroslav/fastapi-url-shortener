name: Python checks 🐍

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/**
      - url-shortener/**

jobs:
  run-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
      - name: Install black
        run: |
          python -m pip install --upgrade pip
          pip install "black==26.10.1"
      - name: Black ⬛️
        run: black --check --diff ./

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
      - name: Install the project
        run: uv sync --locked --all-extras --dev
      - name: Run ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: 'check --diff'
          version-file: 'pyproject.toml'
      - name: Run mypy
        run: uv run mypy url-shortener
  run-tests:
    runs-on: ubuntu-latest
    container:
      node:20-bookworm-slim
    needs:
      - run-checks
    services:
      # Label used to access the service container
      redis:
        # Docker Hub image
        image: redis
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
      - name: Run python test
        run: uv run pytest url-shortener --cov=url-shortener --cov-report=json:coverage.json --cov-report=xml:coverage.xml
        env:
          TESTING: 1
          URL_SHORTENER__REDIS__CONNECTION__HOST: redis
          URL_SHORTENER__REDIS__CONNECTION__PORT: 6379

      - name: Prepare coverage percentage
        run: |
          export EXTRACTED_COVERAGE=$(python -c 'import json;print(json.load(open("coverage.json"))["totals"]["percent_covered_display"])')
          echo "TOTAL_COVERAGE=$EXTRACTED_COVERAGE" >> $GITHUB_ENV
          echo "### Tests coverage: ${EXTRACTED_COVERAGE}%" >> $GITHUB_STEP_SUMMARY
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.json
            coverage.xml
          retention-days: 1

  update-coverage-badge:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - run-tests
    steps:
      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports
      - name: Update coverage badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: 72c0b54d51aeb735494d615b63d90ba0
          filename: coverage.json
          label: Coverage
          message: ${{ env.TOTAL_COVERAGE }}%
          minColorRange: 70
          maxColorRange: 90
          valColorRange: ${{ env.TOTAL_COVERAGE }}

  uploud-to-codecov:
    runs-on: ubuntu-latest
    needs:
      - run-tests
    steps:
      - uses: actions/checkout@v4
      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          dry_run: ${{ env.ACT }}
          fail_ci_if_error: true
          files: coverage.xml
