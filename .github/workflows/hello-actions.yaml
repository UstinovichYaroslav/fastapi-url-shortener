name: Hello World
on:
  push:

jobs:
  hello-job:
    runs-on: ubuntu-latest
    steps:
      - name: My first step in GitHub Actions
        run: echo "Hello World run on ${{ github.event_name }}"

      - name: My second step in GitHub Actions by ${{ github.actor }}
        run: echo "Hello actions in ${{ github.repository }} ref ${{ github.ref }}"

      - name: This step in GH Actions run on ${{ runner.os }}
        run: echo "Action job status ${{ job.status }}"