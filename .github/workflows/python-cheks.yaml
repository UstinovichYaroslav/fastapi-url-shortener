name: Python checks 🐍

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/**
      - url-shortener/**

jobs:
  run-black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Install black
        run: |
          python -m pip install --upgrade pip
          pip install "black==26.10.1"
      - name: Black ⬛️
        run: black ./